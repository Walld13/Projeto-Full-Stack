<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>

    <style>

        body{
            background-color: black;
        }

        .conteiner-flex{
            width: 180px;
            border: 4px solid red;
            display: flex;
            flex-direction: row; /*row, column, row-reverse*/
            flex-wrap: wrap ; /*wrap, wrap reverse, nowrap*/
            flex-flow: row wrap-reverse; /*usa os dois flex*/
        }

        .conteiner-flex > div{
            color: white;
            padding: 4px;
            margin: 4px;
            border: 4px solid white;
        }
    </style>


</head>
<body>
    <h1>Display Flex</h1>

    <div class="conteiner-flex">
        <div>01</div>
        <div>02</div>
        <div>03</div>
        <div>04</div>
        <div>05</div>
        <div>06</div>
        <div>07</div>
        <div>08</div>
        <div>09</div>
        <div>10</div>
    </div>
</body>
</html>
