<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamentos</title>

    <style>

        body{
            background-color: black;
        }

        .conteiner-flex{
            height: 180px;
            border: 4px solid red;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .conteiner-flex > div{
            color: white;
            padding: 4px;
            margin: 4px;
            border: 4px solid white;
        }
    </style>


</head>
<body>
    <h1>Display Flex</h1>

    <div class="conteiner-flex">
        <div>01</div>
        <div>02</div>
        <div>03</div>
        <div>04</div>
    </div>
</body>
</html>
