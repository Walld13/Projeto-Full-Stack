<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamentos</title>

    <style>

        body{
            background-color: black;
        }

        .conteiner-flex{
            width: 400px;
            height: 200px;
            border: 4px solid red;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: start;
        }

        .conteiner-flex > div{
            font-size: 2rem;
            color: white;
            padding: 4px;
            margin: 4px;
            border: 4px solid white;
        }

        .texto-grande{
            font-size: 3rem;
        }

        .coluna{
            flex-direction: column;
        }

        .item{
            align-self: flex-end;
        }
    </style>


</head>
<body>
    <h1>Display Flex</h1>

    <h2 style="color: white">ROW</h2>
    <div class="conteiner-flex">
        <div>01</div>
        <div class="item">02</div>
        <div>03</div>
      
    </div>

    <h2 style="color: white">Columm</h2>
    <div class="conteiner-flex coluna">
        <div>01</div>
        <div class="item">02</div>
        <div>03</div>
      
    </div>




</body>
</html>
