<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamentos</title>

    <style>

        body{
            background-color: black;
        }

        .conteiner-flex{
            /*width: 250px;*/
            height: 200px;
            border: 4px solid red;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: start;
        }

        .conteiner-flex > div{
            font-size: 2rem;
            color: white;
            padding: 4px;
            margin: 4px;
            border: 4px solid white;
        }

        .coluna{
            flex-direction: column;
        }

        .item1, .item3{
            flex-basis: auto;
        } 
        .item2{
            flex-basis: 0;
        }
        
   </style>

</head>
<body>
    <h1>Display Flex</h1>

    <h2 style="color: white">ROW</h2>
    <div class="conteiner-flex">
        <div class="item1">Item teste 01</div>
        <div class="item2">item teste 02</div>
        <div class="item3">Item teste 03</div>
    
    </div>


    <h2 style="color: white">Columm</h2>
    <div class="conteiner-flex coluna">
        <div>Item teste 01</div>
        <div>Item teste 02</div>
        <div>Item teste 03</div>
      
    </div>




</body>
</html>
