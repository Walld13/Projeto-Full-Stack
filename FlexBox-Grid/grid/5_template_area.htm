<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Colunas</title>
<style>
    body{
        font-size: 1.2rem;
        background-color: black;
        color: white;
        margin: 0;
        padding: 20px;
    }

    .grid{
        border: 1px solid red;
        display: grid;
        row-gap: 20px;
        column-gap: 20px;
        grid-template-columns: 1fr 1fr;
        grid-template-areas: 
        
        
        'cabecalho cabecalho'
        'navegacao principal'
        'rodape rodape'
        
        
        ;
    }

    header, nav, main, footer{
        border: 5px solid yellowgreen;
    }

    header {grid-area: cabecalho;}
    nav {grid-area: navegacao;}
    main {grid-area: principal;}
    footer {grid-area: rodape;}


    .nav{
        display: flex;
        flex-direction: column;
        align-items: start;
        justify-content: start;

    }
</style>


</head>
<body>
    
    <div class="grid">
       <header>Cabeçalho</header>
       <nav class="nav">
        <div>Home</div> 
        <div>Produtos</div>
        <div>Login</div>
        <div>Cadastro</div>
    </nav>
       <main>
            <h2>Conteúdo do Sistema</h2>
            <p>Lorem ipsum dolor sit amet consectetur, 
                adipisicing elit. Ad illum itaque deserunt
                 temporibus tempora enim, nulla ipsa sequi 
                 nihil delectus aspernatur ullam quia debitis
                  perferendis nostrum quos harum blanditiis
                   facilis?
            </p>
       </main>
       <footer>Rodapé</footer>
    </div>





</body>
</html>
