<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>
        thead{
            background-color: black;
            color: white;
        }

        caption{
            background-color:blue;
            color: white;
        }
        tfoot{
            background-color: red;
            color: white;
        }
    </style>

</head>
<body>
    <h1>Tabelas - Exercício</h1>

    <table border="1">
        <caption>Lista de países mais populosos</caption> <!--Título-->

                <tr>
                    <th>Posição</th>
                    <th>País</th>
                    <th>População aproximada (milhões)</th>
                </tr>
            <tbody><!--Corpo da tabela-->
                <tr>
                    <td>1</td>
                    <td><img src="../MiniProjeto/Img_src/b1.jpg"> China</td>
                    <td>1.440</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td><img src="../MiniProjeto/Img_src/b2.jpg"> Índia</td>
                    <td>1.380</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td><img src="../MiniProjeto/Img_src/b3.jpg"> Estados Unidos</td>
                    <td>331</td>
                </tr>
                <tr>
                    <td>4</td>
                    <td><img src="../MiniProjeto/Img_src/b4.jpg"> Indonésia</td>
                    <td>273</td>
                </tr>
                <tr>
                    <td>5</td>
                    <td><img src="../MiniProjeto/Img_src/b5.jpg"> Paquistão</td>
                    <td>220</td>
                </tr>
                <tr>
                    <td>6</td>
                    <td><img src="../MiniProjeto/Img_src/b6.jpg"> Brasil</td>
                    <td>212</td>
                </tr>
            <tfoot>
                    <tr>
                        <td colspan="3">fonte: ficticio.com.br</td>
                    </tr>
            </tfoot>
                </tr>
    </table>

    
</body>
</html>
