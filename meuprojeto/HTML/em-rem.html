<style>


/*

 font-size: 2em; /*32px - 1em relativo ao pai*/
}

}

font-size: 2em;
}

.tres-em{

}

 border: 3px solid red;

}

}

.porcentagem{
border: 3px solid red;
font-size: 100%;
}

border: 3px solid black;
width: 500px;
font-size: 32px;
}

</style>

<p class="rem">R Em</p>
