<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens Wallace</title>
</head>
<body>
    <!-- 
    Img - Image (imagem)
    src - Source (Fonte , origem)
    -->
<!--
    
    <img src="imagens/leao.gif" 
        alt="Imagem de uma praia"
        width="900" = Largura
        height="503" = Altura
        Alt = Texto por trás da imagem / Caso a imagem não seja carregada
        Title = Texto frente a imagem/ Aparece quando passar o mouse por cima da imagem
        Figure = Mostrar uma imagem dentro do site/ Parte do site
        Figcaption = Legenda da imagem
        >
-->
    <figure>
         <img src="../Arquivos/imagens/praia 2.jpg" 
        alt="Imagem de uma praia"
        width="300"
        title="praia"
        >
        <figcaption>Praia da boa vista</figcaption>
    </figure>
        


</body>
</html>
