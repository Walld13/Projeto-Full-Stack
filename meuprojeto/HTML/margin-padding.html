<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin e Padding</title>

<link rel="stylesheet" href="../CSS/margin_padding.css">

<style>


h1{
    border: 1px solid red;
}

#topo{
    border: 1px solid red;
    width: 900px;
    margin: 10px auto;
}

p{
    margin: 0;
}

</style>

</head>
<body>

<div id="topo">
    <h1>Esse é um titulo de exemplo</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. 
    Error pariatur labore, reiciendis nemo veritatis nobis soluta doloribus ipsam culpa non assumenda, 
    doloremque explicabo voluptate perferendis obcaecati eos incidunt laborum quos!</p>
</div>




</body>
</html>
