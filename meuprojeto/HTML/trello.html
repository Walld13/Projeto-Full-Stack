<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface de login do Trello</title>

    <!--
      <script src="https://unpkg.com/@codans/trello"></script>
    -->
        <script src="https://unpkg.com/@codans/trello"></script> 
</head>
<body>
<img src="img/trello.svg" width="200" alt="Logo Trello" title="Logo Trello">

    <h1>Fazer login no Trello</h1>

       <form action="Estrutura.html" method="get">
          
          <input type="text" name="email" placeholder="Insira o e-mail"> 
        
          <label for="senha"></label>
          <input type="password" name="senha" placeholder="Insira a senha"> 

          <input type="submit" value="Fazer Login">  

          <span>Ou</span>  

          <button type="submit">
            <img src="img/google.svg" width="20" alt="Google"> Continuar com o Google</button>  

          <button type="submit">
            <img src="img/microsoft.svg" width="20" alt="Microsoft"> Continuar com a Microsoft</button>  
            
          <button type="submit">
            <img src="img/apple.svg" width="20" alt="Apple"> Continuar com a Apple</button>  
              
          <button type="submit">
            <img src="img/slack.svg" width="20" alt="Slack"> Continuar com o Slack</button>  
            
        </form>
        
    <img src="img/atlassian.svg" width="200" alt="Atlassin">

    <img src="img/analytics.svg" width="200" alt="Analytcs">

    <img src="img/interactive.svg" width="200" alt="interactive">
</body>
    
</html>
